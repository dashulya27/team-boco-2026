<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEAM BOCO // DOMINIK 2026</title>
  <link rel="icon" href="./assets/branding/boco.png" type="image/png">
  <style>
    :root { color-scheme: dark; --yellow:#ffd500; --black:#07090d; --panel:#11151d; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 25%,#252b35 0,#0b0e13 42%,#050609 100%); color:#fff; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    main { width:min(720px,100%); border:2px solid var(--yellow); background:linear-gradient(145deg,rgba(24,29,38,.96),rgba(7,9,13,.98)); box-shadow:0 0 42px rgba(255,213,0,.2); padding:clamp(28px,7vw,64px); text-align:center; position:relative; }
    main::before, main::after { content:""; position:absolute; width:42px; height:42px; border-color:var(--yellow); }
    main::before { top:10px; left:10px; border-top:4px solid; border-left:4px solid; }
    main::after { right:10px; bottom:10px; border-right:4px solid; border-bottom:4px solid; }
    .eyebrow { color:var(--yellow); letter-spacing:.18em; font-size:.78rem; }
    h1 { margin:.55em 0 .15em; font:900 clamp(2.5rem,10vw,5.5rem)/.86 Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif; letter-spacing:.03em; }
    h1 span { color:var(--yellow); }
    .mission { margin:1.7rem auto; padding:.8rem 1rem; width:fit-content; border:1px solid #495160; color:#cdd2da; }
    .locked { font-weight:800; color:var(--yellow); animation:pulse 1.7s ease-in-out infinite; }
    .small { color:#858d99; font-size:.8rem; line-height:1.6; }
    .team-logo { display:block; width:110px; height:110px; object-fit:contain; margin:0 auto 18px; }
    label { display:block; margin:1.6rem 0 .6rem; color:#cdd2da; }
    input,button,a.start { font:inherit; border-radius:6px; padding:14px 18px; }
    input { width:100%; max-width:360px; border:1px solid #697386; background:#07090d; color:#fff; text-align:center; font-size:1.2rem; }
    button,a.start { display:inline-block; border:0; background:var(--yellow); color:#07090d; font-weight:800; cursor:pointer; margin-top:14px; text-decoration:none; }
    #feedback { min-height:2.8em; line-height:1.4; color:#ffd500; }
    [hidden] { display:none!important; }
    button:focus-visible,input:focus-visible,a:focus-visible { outline:3px solid white; outline-offset:4px; }
    @media (prefers-reduced-motion:reduce) { .locked { animation:none; } }
    @keyframes pulse { 50% { opacity:.45; } }
  </style>
</head>
<body>
  <main>
    <img class="team-logo" src="./assets/branding/boco.png" alt="BOCO: Bounty und Coco">
    <div class="eyebrow">BIRTHDAY MAJOR // CLASSIFIED ACCESS</div>
    <h1>TEAM <span>BOCO</span></h1>
    <div>MISSION: DOMINIK 2026</div>
    <div class="mission"><span class="locked">● SYSTEM LOCKED</span></div>
    <p>Löse zuerst das Caesar-Rätsel auf Papier.<br>Das entschlüsselte Schlüsselwort öffnet deinen Spielzugang.</p>
    <form id="access-form">
      <label for="access-key">Schlüsselwort aus dem Papier-Rätsel</label>
      <input id="access-key" name="key" autocomplete="off" autocapitalize="characters" spellcheck="false" required maxlength="80">
      <br><button type="submit">ZUGANG PRÜFEN</button>
    </form>
    <p id="feedback" role="status" aria-live="polite"></p>
    <a class="start" id="start-game" href="./game.html" hidden>SPIEL STARTEN →</a>
    <p class="small">AUTHORIZED PLAYER: DOMINIK<br>DEPLOYMENT DATE: 21.10.2026</p>
  </main>
  <script>
    // This is a birthday puzzle gate; client-side checks are not account security.
    function normalizeAccessKey(value) {
      return String(value).trim().toUpperCase().replace(/\s+/g, '');
    }
    function isValidAccessKey(value) {
      return normalizeAccessKey(value) === 'SIMPLE';
    }
    const accessForm = document.getElementById('access-form');
    const feedback = document.getElementById('feedback');
    const startGame = document.getElementById('start-game');
    accessForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      startGame.hidden = true;
      if (!isValidAccessKey(document.getElementById('access-key').value)) {
        feedback.textContent = 'Noch nicht richtig. Gesucht ist nur das Schlüsselwort aus dem Caesar-Rätsel.';
        return;
      }
      feedback.textContent = 'Schlüssel korrekt. Spielzugang wird geprüft …';
      try {
        // Fail visibly if someone deploys the HTML shell without its actual game files.
        const files = ['./game.html', './styles.css', './main.js', './cat-island.js', './mission.js', './room-background.js', './assets/rooms/cat-room/cat-room-structure.png'];
        const checks = await Promise.all(files.map(async (file) => {
          const response = await fetch(file, { cache: 'no-store' });
          return response.ok && (file.endsWith('.html') || !String(response.headers.get('content-type')).includes('text/html'));
        }));
        if (!checks.every(Boolean)) throw new Error('Game files missing');
        sessionStorage.setItem('boco.paper-access.v1', 'granted');
        feedback.textContent = 'ACCESS GRANTED // Deine Mission kann beginnen.';
        startGame.hidden = false;
        startGame.focus();
      } catch (error) {
        feedback.textContent = 'Schlüssel korrekt. Die Spieldateien sind noch nicht vollständig bereit. Bitte die Spielleitung fragen.';
      }
    });
  </script>
</body>
</html>
